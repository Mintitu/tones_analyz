name: Weekly Portfolio Trend
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 6'
permissions:
  contents: read
jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile 1-1.weekly_portfolio.py
      - name: Generate weekly report
        env:
          PORTFOLIO_FILE: USD_53476286_Open.xlsx
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONCENTRATION_PCT: '15'
        run: python weekly_portfolio.py
      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: output-weekly/
          if-no-files-found: warn
          retention-days: 90
