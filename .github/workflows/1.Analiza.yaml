name: 1. Analiza Portofoliu

on:
  schedule:
    - cron: '0 20 * * 1-5'
  push:
    paths:
      - '*.xlsx'
      - '1.Analiza.py'
  workflow_dispatch:

jobs:
  Compilez:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests yfinance tabulate

      - name: Run portfolio update script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python 1.Analiza.py

      - name: Commit and push updated Markdown report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Analiza.md AnalizaTG.md
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update portfolio report and telegram document"
          git push