name: 1 Daily Portofolio

on:
  schedule:
    - cron: '20 19 * * 1-5' # Luni - Vineri la 19:20 UTC
  push:
    paths:
      - '1.sp500-drop.py'
      - '.github/workflows/1.sp500-drop.yaml'
  workflow_dispatch:

jobs:
  Compilez:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests yfinance tabulate

      - name: Run SP500-drop update script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python 1.sp500-drop.py

      - name: Commit and push updated Markdown report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SP500-drop.md
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update SP500-drop and telegram document"
          git push