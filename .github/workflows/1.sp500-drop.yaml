name: 1 Daily SP500 Adjusted Moves

on:
  schedule:
    # Luni-Vineri la 21:30 UTC = dupa inchiderea bursei SUA si vara (20:00 UTC) si iarna (21:00 UTC)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:         # test manual: Actions > 1 Daily Portofolio > Run workflow

permissions:
  contents: read

jobs:
  Compilez:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-sp500.txt

      - name: Check syntax
        run: python -m py_compile 1.sp500-drop.py

      - name: Run adjusted SP500 alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISE_24H: '7'
          NOTIFY_NO_HITS: '1'
          TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          DROP_24H: '7'          # scadere ajustata de cel putin 7% fata de sedinta anterioara
          DROP_48H: '14'         # scadere ajustata de cel putin 14% fata de acum 2 sedinte
          # La pornire manuala verifica ultima sedinta disponibila, chiar daca azi bursa e inchisa
          ONLY_IF_SESSION_TODAY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python 1.sp500-drop.py

      - name: Save diagnostic CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp500-adjusted-scan
          path: output-sp500/
          if-no-files-found: warn
          retention-days: 30
