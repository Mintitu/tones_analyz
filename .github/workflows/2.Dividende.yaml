name: 2. Dividende

on:
  push:
    paths:
      - '*.xlsx'
      - '2.Dividende.py'
  workflow_dispatch:

jobs:
  Conpilez:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculez Dividendele Castigate
        run: |
          python 2.Dividende.py

      - name: Send Report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Trimitem pe Telegram doar fisierul text simplu curat
          REPORT_TEXT=$(cat DividendeTG.txt)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${REPORT_TEXT}"

      - name: Commit and push updated reports to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Dividende.md DividendeTG.txt
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update Dividende reports"
          git push
