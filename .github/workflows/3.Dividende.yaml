name: 3 Dividende Status

on:
  push:
    paths:
      - 'USD_53476286_*.xlsx'
      - '3.Dividende.py'
  workflow_dispatch:                            # Permite pornirea manuală sau prin API-ul GitHub

jobs:
  Compilez:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculez Dividendele Castigate
        run: |
          python 3.Dividende.py

      - name: Send Report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<EOF
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          # 1. Trimitem textul simplu (summary + top companii)
          with open("DividendeTG.txt", "r", encoding="utf-8") as f:
              text_content = f.read()

          url_msg = f"https://api.telegram.org/bot{token}/sendMessage"
          requests.post(url_msg, json={"chat_id": chat_id, "text": text_content})

          # 2. Trimitem si fisierul .md fizic in chat-ul de Telegram
          url_doc = f"https://api.telegram.org/bot{token}/sendDocument"
          with open("Dividende.md", "rb") as doc:
              requests.post(url_doc, data={"chat_id": chat_id}, files={"document": doc})

          print("Raportul si fisierul MD au fost trimise pe Telegram cu succes!")
          EOF

      - name: Commit and push updated reports to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Dividende.md DividendeTG.txt
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update Dividende reports"
          git push
