name: Convert XLS in CSV

on:
  workflow_dispatch: # Rulează doar când apeși tu manual pe butonul din GitHub

jobs:
  convert-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl

      - name: Convertește Excel în CSV
        run: python convert_xls_in_csv.py
