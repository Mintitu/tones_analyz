name: US Stock Daily Bot

on:
  schedule:
    # Rulează în fiecare zi de luni până vineri la ora 22:00 (după închiderea bursei SUA)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Îți dă voie să apeși pe un buton să îl pornești și manual oricând vrei

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Run Python script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock.py
