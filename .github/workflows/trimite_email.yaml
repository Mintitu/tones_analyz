name: Raport Lunar Automat pe Email

on:
  schedule:
    # Ruleaza in prima zi a fiecarei luni la ora 07:00 UTC (09:00 ora Romaniei)
    - cron: '0 7 1 * *'
  workflow_dispatch: # Permite declansarea manuala sau din Telegram/API

jobs:
  ruleaza_analiza_lunara:
    runs-on: ubuntu-latest

    steps:
      - name: Descarca codul din repository
        uses: actions/checkout@v3

      - name: Configurare mediu Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare dependinte
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executare analiza si trimitere Email
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          python trimite_email.py